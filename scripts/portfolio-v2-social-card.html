<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leo Sanga portfolio social card</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("../src/assets/portfolio-v2/fonts/InstrumentSans-Variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 400 700;
      }

      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../src/assets/portfolio-v2/fonts/IBMPlexMono-Regular.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #211b29;
        background: #f7f3f8;
        font-family: "Instrument Sans", Arial, sans-serif;
      }

      main {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      main::before {
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(circle at 88% 18%, rgba(203, 183, 245, 0.24), transparent 28%),
          linear-gradient(110deg, #f7f3f8 0%, #f7f3f8 58%, #f0eaf3 100%);
        content: "";
      }

      main::after {
        position: absolute;
        inset: 32px;
        z-index: -1;
        border: 1px solid rgba(81, 73, 90, 0.14);
        border-radius: 30px;
        content: "";
      }

      .identity {
        position: absolute;
        top: 78px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .identity svg {
        width: 56px;
        height: 56px;
      }

      .identity-rule {
        width: 340px;
        height: 1px;
        background: linear-gradient(90deg, #8b809a, rgba(139, 128, 154, 0.08));
      }

      .eyebrow {
        position: absolute;
        top: 166px;
        left: 72px;
        margin: 0;
        color: #526f8a;
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 14px;
        line-height: 1;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        position: absolute;
        top: 206px;
        left: 68px;
        margin: 0;
        font-size: 80px;
        font-weight: 620;
        line-height: 0.96;
        letter-spacing: -0.045em;
      }

      .role {
        position: absolute;
        top: 318px;
        left: 72px;
        width: 570px;
        margin: 0;
        color: #51495a;
        font-size: 36px;
        font-weight: 480;
        line-height: 1.15;
        letter-spacing: -0.025em;
      }

      .role span {
        display: block;
      }

      .portrait {
        position: absolute;
        top: 72px;
        right: 72px;
        width: 396px;
        height: 486px;
        overflow: hidden;
        background: #f0eaf3;
        border: 1px solid rgba(82, 111, 138, 0.34);
        border-radius: 24px;
        box-shadow: 0 28px 72px rgba(47, 31, 55, 0.18);
      }

      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 48%;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="identity" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M11 24H24" stroke="#8B809A" stroke-width="2.5" stroke-linecap="round" />
          <path
            d="M24 14V34M24 14H37M24 34H37"
            stroke="#8B809A"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="4" y="21" width="7" height="7" rx="1.5" fill="#B79DE9" stroke="#51495A" />
          <rect x="37" y="10" width="7" height="7" rx="1.5" fill="#82A3C1" stroke="#51495A" />
          <rect x="37" y="31" width="7" height="7" rx="1.5" fill="#82A3C1" stroke="#51495A" />
        </svg>
        <span class="identity-rule"></span>
      </div>
      <p class="eyebrow">Portfolio / Systems Engineering</p>
      <h1>Leo Sanga</h1>
      <p class="role">
        <span>Systems Engineer:</span>
        <span>Integration + Automation</span>
      </p>
      <figure class="portrait">
        <img src="../src/assets/portfolio-v2/portrait/leo-sanga-hero-4x5-1200.avif" alt="" />
      </figure>
    </main>
  </body>
</html>
