<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 566" font-family="'Instrument Sans', ui-sans-serif, system-ui, sans-serif">
  <title>Booking agent workflow overview map</title>
  <desc>Overview of the n8n booking agent workflow in twelve stages. Settings and guest lookup, the AI reply
  checked by code, and the check for meetings booked outside the chat lead into routing. Routing sends each
  request down one lane: booking, rescheduling, or cancelling. Booking checks the time and holds it, handles
  a time that is taken, and creates the meeting. Rescheduling checks the request, then moves the meeting,
  and reuses the booking checks. Every marked stage also ends at the reply-and-notify stage. A nightly
  cleanup runs on its own, with no connection to the rest.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8D80AA"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1220" height="566" fill="#F7F3F8"/>

  <text x="280" y="160" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" fill="#6E6575">booking</text>
  <text x="280" y="300" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" fill="#6E6575">rescheduling</text>
  <text x="280" y="440" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" fill="#6E6575">cancelling</text>

  <g class="zone" data-zone="1">
    <rect x="40" y="40" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="40" y="40" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="140" y="62" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">1</text>
    <text x="140" y="86" text-anchor="middle" font-size="15" fill="#211B29">Check settings and</text>
    <text x="140" y="105" text-anchor="middle" font-size="15" fill="#211B29">look up the guest</text>
  </g>
  <g class="zone" data-zone="2">
    <rect x="280" y="40" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="280" y="40" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="380" y="62" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">2</text>
    <text x="380" y="86" text-anchor="middle" font-size="15" fill="#211B29">AI reply, checked by</text>
    <text x="380" y="105" text-anchor="middle" font-size="15" fill="#211B29">code</text>
  </g>
  <g class="zone" data-zone="3">
    <rect x="520" y="40" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="520" y="40" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="620" y="62" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">3</text>
    <text x="620" y="86" text-anchor="middle" font-size="15" fill="#211B29">Catch meetings booked</text>
    <text x="620" y="105" text-anchor="middle" font-size="15" fill="#211B29">outside the chat</text>
  </g>
  <g class="zone" data-zone="4">
    <rect x="40" y="170" width="200" height="356" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="40" y="170" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="140" y="192" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">4</text>
    <text x="140" y="216" text-anchor="middle" font-size="15" fill="#211B29">Route the request</text>
  </g>
  <g class="zone" data-zone="5">
    <rect x="280" y="170" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="280" y="170" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="380" y="192" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">5</text>
    <text x="380" y="216" text-anchor="middle" font-size="15" fill="#211B29">Check the time is free</text>
    <text x="380" y="235" text-anchor="middle" font-size="15" fill="#211B29">and hold it</text>
  </g>
  <g class="zone" data-zone="6">
    <rect x="520" y="170" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="520" y="170" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="620" y="192" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">6</text>
    <text x="620" y="216" text-anchor="middle" font-size="15" fill="#211B29">Handle a time that is</text>
    <text x="620" y="235" text-anchor="middle" font-size="15" fill="#211B29">already taken</text>
  </g>
  <g class="zone" data-zone="7">
    <rect x="760" y="170" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="760" y="170" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="860" y="192" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">7</text>
    <text x="860" y="216" text-anchor="middle" font-size="15" fill="#211B29">Create the meeting</text>
  </g>
  <g class="zone" data-zone="8">
    <rect x="280" y="310" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="280" y="310" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="380" y="332" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">8</text>
    <text x="380" y="356" text-anchor="middle" font-size="15" fill="#211B29">Reschedule: check the</text>
    <text x="380" y="375" text-anchor="middle" font-size="15" fill="#211B29">request</text>
  </g>
  <g class="zone" data-zone="9">
    <rect x="520" y="310" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="520" y="310" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="620" y="332" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">9</text>
    <text x="620" y="356" text-anchor="middle" font-size="15" fill="#211B29">Reschedule: move the</text>
    <text x="620" y="375" text-anchor="middle" font-size="15" fill="#211B29">meeting</text>
  </g>
  <g class="zone" data-zone="10">
    <rect x="280" y="450" width="200" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5"/>
    <rect x="280" y="450" width="200" height="4" rx="2" fill="#CBB7F5"/>
    <text x="380" y="472" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">10</text>
    <text x="380" y="496" text-anchor="middle" font-size="15" fill="#211B29">Cancel</text>
  </g>
  <g class="zone" data-zone="11">
    <rect x="1000" y="170" width="180" height="356" rx="10" fill="#F7F3F8" stroke="#B9ACC3" stroke-width="2.5"/>
    <rect x="1000" y="170" width="180" height="4" rx="2" fill="#CBB7F5"/>
    <text x="1090" y="192" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">11</text>
    <text x="1090" y="216" text-anchor="middle" font-size="15" fill="#211B29">Reply to the guest</text>
    <text x="1090" y="235" text-anchor="middle" font-size="15" fill="#211B29">and tell the team</text>
    <circle cx="1022" cy="486" r="5" fill="#4F6B85"/>
    <text x="1034" y="491" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#6E6575">Each marked stage</text>
    <text x="1034" y="509" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#6E6575">also ends here</text>
  </g>
  <g class="zone" data-zone="12">
    <rect x="1000" y="40" width="180" height="76" rx="10" fill="#F7F3F8" stroke="#D9D0DF" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="1000" y="40" width="180" height="4" rx="2" fill="#CBB7F5"/>
    <text x="1090" y="62" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#4F6B85">12</text>
    <text x="1090" y="86" text-anchor="middle" font-size="15" fill="#211B29">Nightly cleanup</text>
    <text x="1090" y="105" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#6E6575">runs on its own</text>
  </g>

  <path class="flow" data-from="1" data-to="2" d="M 240,78 L 280,78" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="2" data-to="3" d="M 480,78 L 520,78" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="2" data-to="4" d="M 330,116 L 330,136 L 110,136 L 110,170" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="3" data-to="4" d="M 620,116 L 620,146 L 170,146 L 170,170" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="4" data-to="5" d="M 240,208 L 280,208" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="4" data-to="8" d="M 240,348 L 280,348" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="4" data-to="10" d="M 240,488 L 280,488" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="5" data-to="4" d="M 300,246 L 300,272 L 240,272" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="5" data-to="6" d="M 480,208 L 520,208" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path class="flow" data-from="6" data-to="5" d="M 480,208 L 520,208" fill="none" stroke="none" opacity="0"/>
  <path class="flow" data-from="6" data-to="7" d="M 720,208 L 760,208" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="5" data-to="7" d="M 460,246 C 460,294 860,294 860,246" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="6" data-to="9" d="M 620,246 L 620,310" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path class="flow" data-from="9" data-to="6" d="M 620,246 L 620,310" fill="none" stroke="none" opacity="0"/>
  <path class="flow" data-from="8" data-to="5" d="M 420,310 L 420,246" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="8" data-to="9" d="M 480,348 L 520,348" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="flow" data-from="8" data-to="10" d="M 380,386 L 380,450" fill="none" stroke="#8D80AA" stroke-width="2" marker-end="url(#arrow)"/>

  <path class="flow-bus" data-from="2" data-to="11" d="M 461,54 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="3" data-to="11" d="M 701,54 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="4" data-to="11" d="M 221,184 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="5" data-to="11" d="M 461,184 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="6" data-to="11" d="M 701,184 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="7" data-to="11" d="M 941,184 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="8" data-to="11" d="M 461,324 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="9" data-to="11" d="M 701,324 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
  <path class="flow-bus" data-from="10" data-to="11" d="M 461,464 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0" fill="#4F6B85"/>
</svg>
